name: ML

on:
  push:
    branches: [main]
    paths: ["ml/**", ".github/workflows/ml.yml"]
  pull_request:
    paths: ["ml/**", ".github/workflows/ml.yml"]
  workflow_dispatch:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install tooling
        run: pip install ruff pytest
      - name: ruff
        run: ruff check ml
      - name: pytest
        # The dev extra carries numpy/onnx so the Rust/Python attribution parity
        # tests really run here (they importorskip otherwise, silently weakening
        # the seam).
        run: |
          pip install -e "ml[dev]"
          pytest ml/tests
