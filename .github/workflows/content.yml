name: Content

on:
  push:
    branches: [main]
    paths: ["rules/**", "crates/sigma/**", ".github/workflows/content.yml"]
  pull_request:
    paths: ["rules/**", "crates/sigma/**", ".github/workflows/content.yml"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The sigma crate's content suite loads the whole rules/sigma tree through the
      # real engine: every shipped rule must parse inside the supported subset AND
      # fire on its crafted matching sample (crates/sigma/tests/content.rs).
      # YARA content validation joins here when rules/yara gains content (#17).
      - name: sigma content suite
        run: cargo test -p sigma --test content
