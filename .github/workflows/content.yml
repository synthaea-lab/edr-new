name: Content

on:
  push:
    branches: [main]
    paths: ["rules/**", ".github/workflows/content.yml"]
  pull_request:
    paths: ["rules/**", ".github/workflows/content.yml"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Baseline: every Sigma rule must at least be valid YAML. Replaced by real
      # linting (sigma-cli validation, yara-x compile check) once content lands.
      - name: Validate Sigma YAML
        run: |
          pip install pyyaml
          python3 - <<'EOF'
          import glob, sys, yaml
          failed = False
          files = glob.glob("rules/sigma/**/*.yml", recursive=True)
          for f in files:
              try:
                  with open(f) as fh:
                      list(yaml.safe_load_all(fh))
              except yaml.YAMLError as e:
                  print(f"invalid YAML: {f}: {e}")
                  failed = True
          print(f"checked {len(files)} sigma rule files")
          sys.exit(1 if failed else 0)
          EOF
