name: Content

on:
  workflow_dispatch: # billing blocked — re-enable push/pull_request when resolved

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Each engine's content suite loads its whole rules/ tree through the real
      # engine: every shipped rule must compile/validate AND fire on its crafted
      # matching sample (crates/{sigma,yara}/tests/content.rs).
      - name: sigma content suite
        run: cargo test -p sigma --test content
      - name: yara content suite
        run: cargo test -p yara --test content
