[package]
name = "ml"
version = "0.1.0"
description = "On-device ML inference (ONNX) and feature extraction"
license.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Default feature enables dynamic ONNX Runtime for easy dev builds.
# Production builds disable this and use manually-built static libraries.
#
# Dev builds (default):     cargo build/test (downloads onnxruntime)
# Production builds:         cargo build --release --no-default-features
#                            Requires ORT_LIB_LOCATION + manual build (see README)
default = ["dynamic-onnx"]
dynamic-onnx = ["ort/download-binaries", "ort/tls-rustls"]

[dependencies]
schema = { path = "../schema" }
correlator = { path = "../correlator" }
thiserror = { workspace = true }
# Workspace ort is configured with default-features = false.
# The dynamic-onnx feature (enabled by default) re-enables download-binaries for dev builds.
ort = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
schema = { path = "../schema", features = ["test-fixtures"] }
# Integration tests (capture_parity, correlation_scorer) build event windows and
# score end-to-end: events -> schema::Event -> EventBus -> vector -> model. Both
# crates are already in [dependencies], so tests pick them up as-is.
