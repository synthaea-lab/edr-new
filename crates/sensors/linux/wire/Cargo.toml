[package]
name = "sensor-linux-wire"
version = "0.1.0"
description = "Ring-buffer wire format shared by the Linux eBPF probes and their userspace loader"
license.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Userspace decode helpers (comm_str, boot_epoch_offset_ns) — std required.
# The eBPF crate (`../ebpf`, no_std bpfel target) must NOT enable this.
user = []

[dependencies]

[target.'cfg(target_os = "linux")'.dependencies]
# boot_epoch_offset_ns only: clock_gettime + the failure warning.
libc = { version = "0.2", default-features = false }
tracing = { workspace = true }
