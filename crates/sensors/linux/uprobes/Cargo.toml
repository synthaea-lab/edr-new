[package]
name = "sensor-linux-uprobes"
version = "0.1.0"
description = "Linux uprobe telemetry: TLS plaintext taps, shell readline"
license.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
schema = { path = "../../../schema" }
log = { version = "0.4", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
goblin = { version = "0.9", default-features = false, features = ["elf64", "elf32", "endian_fd", "std"] }
thiserror = "2.0"

[[example]]
name = "symbol_resolution_spike"
path = "examples/symbol_resolution_spike.rs"
