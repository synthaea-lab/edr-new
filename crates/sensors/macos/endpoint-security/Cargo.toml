[package]
name = "sensor-macos"
version = "0.1.0"
description = "macOS sensor: EndpointSecurity-based telemetry"
license.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
schema = { path = "../../../schema" }
thiserror = { workspace = true }
tracing = { workspace = true }
# kMDItemWhereFroms is a binary plist; parsing it by hand is exactly the kind
# of fragile byte-poking a maintained parser exists for. Unconditional (not
# macOS-gated) because `normalize` — where the parsing lives — is the
# cross-platform, unit-tested half of this crate.
plist = "1"

# Unconditional, not target-gated: build scripts compile for the HOST, so a
# `[target.'cfg(target_os = "macos")'.build-dependencies]` gate (which follows
# the TARGET) would leave a macOS host without `cc` when cross-checking the
# Linux target (`cargo clippy --target x86_64-unknown-linux-gnu`). The build
# script itself returns early on every non-macOS target.
[build-dependencies]
cc = "1"
