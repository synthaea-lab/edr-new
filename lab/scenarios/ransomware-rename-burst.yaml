name: ransomware-rename-burst
platform: linux
script: ransomware-rename-burst.sh
simulates: >
  A burst of file renames by one process, each keeping the original filename intact
  and appending a new suffix (invoice.pdf -> invoice.pdf.locked) — T1486, Data
  Encrypted for Impact. Ransomware's near-universal tell, matched extension-agnostic
  ("old_path is a strict prefix of new_path") rather than against a hardcoded
  extension list. The scenario creates and renames only its own throwaway files;
  nothing is actually encrypted.
expected_detections:
  - technique: "T1486"
    rule: check_mass_rename_pattern   # crates/rules/src/state.rs — sliding-window
                                       # count of same-pid appended-suffix renames
    min_count: 1
    tolerance: 0
notes: >
  RANSOMWARE_RENAME_THRESHOLD is 20 renames in RANSOMWARE_RENAME_WINDOW_NS (5s); the
  script renames 22 for timing margin. One alert per window by design (SlidingCounter
  one-alert-per-window), so min_count stays 1 regardless of the exact rename count.
