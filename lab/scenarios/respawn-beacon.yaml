name: respawn-beacon
platform: linux
script: respawn-beacon.sh
simulates: >
  A listener that respawns (new pid via fork+exec) on every accepted connection,
  combined with repeated client connections to the same (comm, dest, port) —
  automatic respawn with beaconing, a persistent C2 pattern.
expected_detections:
  - technique: "T1071/T1041"
    rule: check_beacon           # crates/rules/src/state.rs — client-side connections alone
                                  # cross BEACON_THRESHOLD regardless of listener pid churn,
                                  # keyed on (comm, daddr, dport), not pid
    min_count: 1
    tolerance: 0
  - technique: "T1059/T1071"
    rule: rule_respawn_connect   # crates/correlator/src/rules.rs
    min_count: 1
    tolerance: 1   # observed 2 alert lines on real hardware (see notes) — timing-sensitive,
                    # not asserting an exact count
notes: >
  Live-tested 2026-09-18 on real hardware (Hyper-V lab, Arch Linux 7.2.4-arch1-2 —
  see lab/vagrant-hyperv/) after an inconclusive WSL2 attempt earlier the same day.
  Both alerts above confirmed firing reliably. Correcting an earlier note that
  removed rule_respawn_connect from this file entirely (2026-09-18, PR #229): that
  removal was wrong on the "does it fire" question, but right about *why* it
  shouldn't — worth reading both halves.

  rule_respawn_connect groups by (ppid, comm). Traced the exact pids on real
  hardware: the *listener's* respawns (setsid'd `while true; do nc -l ...; done`)
  share one (ppid, comm) group and confirmed NEVER produce a Connect event —
  accept() is not traced, only connect() (`agent status` lists `sys_enter_connect`,
  no accept probe) — so the listener side alone genuinely cannot satisfy this rule,
  exactly as hypothesized before. But this scenario also has a *client*-side loop
  (`for i in ...; do echo ... | nc -w1 ... ; done`) whose repeated `nc` invocations
  all share the *script's own* pid as parent — a second, independent (ppid, comm)
  group that legitimately has both repeated Exec (>= RESPAWN_THRESHOLD) and Connect
  in the same bucket, and that's what actually trips the rule here. So the alert is
  real and reproducible, but for a reason the script's own header comment doesn't
  describe (it frames this as testing the *listener's* automatic-respawn behavior;
  what's actually exercised is the *client* loop coincidentally matching the same
  shape). Worth a follow-up to either fix the header comment's framing or redesign
  the scenario (e.g. `setsid`-ing each client connection so it doesn't share the
  script's pid) if testing the listener-respawn case specifically still matters —
  not done here, flagging for whoever owns this scenario next.
