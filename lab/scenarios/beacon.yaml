name: beacon
platform: linux
script: beacon.sh
simulates: >
  Periodic same-destination C2 traffic (>= BEACON_THRESHOLD connections to the
  same comm/dest/port within BEACON_WINDOW_NS, on a non-standard port).
expected_detections:
  - technique: "T1071/T1041"
    rule: check_beacon       # crates/rules fn name — traceability if the rule moves/renames
    min_count: 1
    tolerance: 0
  - technique: "T1059/T1071"
    rule: rule_respawn_connect   # crates/correlator/src/rules.rs
    min_count: 1
    tolerance: 20   # unbounded by design, see notes — this rule re-fires on every
                     # qualifying event once past RESPAWN_THRESHOLD, not one-shot per
                     # window like check_beacon; 20 is "plenty of headroom", not a
                     # measured ceiling
notes: >
  Live-tested 2026-09-18, three times: first in WSL2 (kernel 6.6.114-microsoft-standard-WSL2),
  then twice on real hardware (Hyper-V lab, Arch Linux 7.2.4-arch1-2) — once manually,
  once through `ml.synthaea_ml.evaluation.scenario_replay` (issue #44's replay engine,
  first real run through it). The BEACON alert fired exactly once every time, confirmed.

  Correcting TWO earlier versions of this note. First (PR #229): I'd written off the
  co-occurring `rule_respawn_connect` firing as a WSL2 ppid=0 artifact and left it
  unasserted. Real hardware proved that wrong — it fires reliably there too, for a
  genuine, traceable reason (see respawn-beacon.yaml's notes for the pid-by-pid trace):
  `rule_respawn_connect` groups by (ppid, comm), and this script's client loop
  (`for i in ...; do echo ... | nc -w1 ...; done`) spawns CONNECTIONS (4) `nc`
  invocations sharing the *script's own* pid as parent — that alone is
  >= RESPAWN_THRESHOLD (3) with each spawn also connecting, independent of the
  listener. Second (PR #232): I then asserted `tolerance: 1` based on a single real
  run that happened to show 2 alert lines — too tight. The replay engine's first real
  run against this exact scenario measured **7** `rule_respawn_connect` lines, not 2:
  unlike `check_beacon` (deduped one-shot per window via `try_alert`), this rule has no
  such dedup — every additional qualifying spawn+connect past the threshold re-fires
  it, so the count scales with how many client connections happen to land inside one
  window, not a fixed number. `tolerance: 20` reflects "this rule firing repeatedly is
  the expected, correct behavior", not a measured upper bound — a future run producing
  more than 21 hits total is still very likely genuine, and the scenario would need a
  higher tolerance again rather than treating that run as a regression.
