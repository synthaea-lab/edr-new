name: argv
platform: linux
script: argv.sh
simulates: >
  A shell one-liner with a base64 decode in its arguments — the argv/cmdline capture
  fidelity assertion for issue #152 (/proc/<pid>/cmdline read at drain time, not a
  frozen mm->arg_start..arg_end offset).
expected_detections:
  - technique: "T1059.004"
    rule: check_base64_decode   # crates/rules/src/stateless.rs — stateless, cmdline substring
    min_count: 3   # ITERATIONS=3 in the script, one alert per iteration, no windowed dedup
    tolerance: 0
notes: >
  Tests capture fidelity for a cooperative process, not tamper resistance: cmdline is
  read at drain time, so a process that rewrites its own argv before the read can spoof
  what this rule sees (known gap of read_proc_cmdline; image_path stays authoritative
  regardless — out of scope here). The script's `sleep 0.2` inside the `sh -c` payload
  is deliberate: a bare `echo | base64` pipeline exits in ~1-2ms and can legitimately
  lose the userspace drain race under load (observed on kernel 6.1 in the Hyper-V lab)
  — that race is a known, accepted gap, not what this scenario measures.

  Confirmed on real hardware 2026-09-09/10 (Hyper-V lab, Ubuntu 22.04/5.15.0-91 and
  Debian 12/6.1.0-17, PR #155): 3/3 T1059.004 alerts on both kernels, full argv
  captured from /proc/<pid>/cmdline every time, never empty. min_count: 3 above
  matches that result.

  Tried again 2026-09-18 in WSL2 (kernel 6.6.114-microsoft-standard-WSL2): zero
  alerts. Checked events.jsonl directly: `cmdline`/`argv` were empty ("" / []) for
  every single exec event in that run, not just this scenario's, and the same run
  also showed ppid=0 for every process (see lineage.yaml's notes) — a broader
  WSL2-specific capture defect, not a #152 regression (already ruled out by the
  real-hardware run above). WSL2 isn't a row in lab/MATRIX.md; don't use it to
  sanity-check this scenario.
