[project]
name = "synthaea-ml"
version = "0.1.0"
description = "Synthaea ML space: features, training, calibration, evaluation, ONNX export"
requires-python = ">=3.11"
# Dependencies are added as code is migrated (numpy, scikit-learn, onnx, onnxruntime, ...).
dependencies = []

[project.optional-dependencies]
# numpy/onnx power the attribution parity tests (tests/attribution_reference.py);
# training-side deps (scikit-learn, skl2onnx, onnxruntime) arrive with the pipeline
# migration and are only needed locally to regenerate fixtures.
dev = ["ruff", "pytest", "numpy", "onnx"]

# The package is `synthaea_ml` alone — sibling directories (datasets/, registry/,
# notebooks/) hold data and docs, not code, and must not be auto-discovered.
[tool.setuptools.packages.find]
include = ["synthaea_ml*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
