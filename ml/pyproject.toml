[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synthaea-ml"
version = "0.1.0"
description = "Synthaea ML space: features, training, calibration, evaluation, ONNX export"
requires-python = ">=3.11"
# The feature/calibration modules are pure stdlib; the heavier deps serve training,
# export, and the ONNX oracle.
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "skl2onnx>=1.16",
    "onnxruntime>=1.17",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "pytest>=8"]

[tool.setuptools.packages.find]
include = ["synthaea_ml*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
