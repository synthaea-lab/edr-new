version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: synthaea
      POSTGRES_USER: synthaea
      POSTGRES_PASSWORD: synthaea_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synthaea"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://synthaea:synthaea_dev@postgres:5432/synthaea
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: dev_secret_change_in_production
      BETTER_AUTH_SECRET: dev_secret_change_in_production
      CRON_SECRET: dev_cron_secret
      NGINX_PROXY_SECRET: dev_nginx_secret_change_in_production
      NODE_ENV: development
    # SECURITY: Port 3000 should NOT be exposed in production
    # Only the nginx proxy (8443) should be accessible
    # Uncomment for local development debugging only:
    # ports:
    #   - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: sh -c "npx prisma migrate deploy && npm run dev"

  # mTLS terminating proxy (nginx)
  proxy:
    image: nginx:alpine
    depends_on:
      - server
    environment:
      # Shared secret for proxy authentication
      NGINX_PROXY_SECRET: dev_nginx_secret_change_in_production
    ports:
      - "8443:8443" # Agent ingest (mTLS)
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro

volumes:
  postgres_data:
