version: "3.8"

# Test environment - isolated database on different port
services:
  postgres-test:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: synthaea_test
      POSTGRES_USER: synthaea
      POSTGRES_PASSWORD: synthaea_test
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synthaea"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_test_data:
