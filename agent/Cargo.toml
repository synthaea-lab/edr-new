[package]
name = "agent"
version = "0.1.0"
description = "The Synthaea agent binary — wires sensors, detection, and response together"
license.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
schema = { path = "../crates/schema" }
policy = { path = "../crates/policy" }
rules = { path = "../crates/rules" }
correlator = { path = "../crates/correlator" }
sigma = { path = "../crates/sigma" }
enrich = { path = "../crates/enrich" }
yara = { path = "../crates/yara" }
sinks = { path = "../crates/sinks" }
tamper = { path = "../crates/tamper" }

anyhow = "1"
serde = { workspace = true }
clap = { version = "4", features = ["derive"] }
env_logger = { version = "0.11", default-features = false, features = ["auto-color"] }
log = "0.4"

[target.'cfg(windows)'.dependencies]
sensor-windows = { path = "../crates/sensors/windows/etw" }
sensor-windows-eventlog = { path = "../crates/sensors/windows/eventlog" }
ctrlc = "3"

[target.'cfg(target_os = "linux")'.dependencies]
sensor-linux = { path = "../crates/sensors/linux/userspace" }
sensor-linux-audit = { path = "../crates/sensors/linux/audit" }
sensor-linux-netlink = { path = "../crates/sensors/linux/netlink" }
sensor-linux-journal = { path = "../crates/sensors/linux/journal" }
libc = "0.2"

# sensor-linux-lsm is not wired into `cmd_run` yet (issue #91 — inline blocking
# needs the verdict model from #131/#133 first); only the real-kernel regression
# test below exercises it.
[target.'cfg(target_os = "linux")'.dev-dependencies]
sensor-linux-lsm = { path = "../crates/sensors/linux/lsm" }
