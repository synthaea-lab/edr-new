[package]
name = "watchdog"
version = "0.1.0"
description = "Watchdog: installs and supervises the agent as a system service (systemd / Windows SCM / launchd)"
license.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.6"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"
