# cargo-deny configuration — licenses, security advisories, and dependency hygiene.
# Run locally with `cargo deny check`; CI runs it on every push.

[graph]
all-features = true

[advisories]
# RUSTSEC advisories: any vulnerable or yanked dependency fails the build.
version = 2
yanked = "deny"

[licenses]
version = 2
# The project is Apache-2.0; dependencies must stay in this permissive set.
# The GPLv2 eBPF probe crate is excluded from the workspace and licensed separately.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]

# Per-crate license exceptions (narrower than widening `allow` for everyone).
[[licenses.exceptions]]
# Pulled only at build time by ort's onnxruntime binary downloader (ureq -> rustls);
# CDLA-Permissive-2.0 is a permissive data license, not in the global set above.
name = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Version-less path dependencies between workspace crates are the normal internal
# wiring, not the registry-wildcard hazard the deny is for.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
