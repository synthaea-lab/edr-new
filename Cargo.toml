# Workspace manifest for the Synthaea agent side (Rust).
#
# Crate directories and package names carry no project prefix — the workspace scopes
# them. Platform sensors live under crates/sensors/<platform> (packages sensor-*).
# Crates that need a special toolchain or target are excluded from the default build
# and built explicitly:
#   - crates/sensors/linux/ebpf   -> bpfel-unknown-none (aya), GPLv2
#   - crates/sensors/windows/etw  -> Windows/ETW (stub on other targets)
#   - crates/sensors/macos/endpoint-security -> macOS/EndpointSecurity (stub on other targets)

[workspace]
resolver = "2"
members = [
    "agent",
    "watchdog",
    "cli",
    "crates/schema",
    "crates/policy",
    "crates/config",
    "crates/store",
    "crates/sensors/linux/wire",
    "crates/sensors/linux/userspace",
    "crates/sensors/linux/ebpf",
    "crates/sensors/linux/audit",
    "crates/sensors/windows/etw",
    "crates/sensors/macos/endpoint-security",
    "crates/sensors/macos/network-extension",
    "crates/rules",
    "crates/sigma",
    "crates/correlator",
    "crates/ml",
    "crates/yara",
    "crates/intel",
    "crates/enrich",
    "crates/response",
    "crates/ipc",
    "crates/transport",
    "crates/sinks",
    "crates/updater",
    "crates/conformance",
    "crates/tamper",
    "crates/mesh",
    "crates/deception",
    "crates/device-control",
    "crates/inventory",
]
# The eBPF probe crate is a member (aya-build resolves it by package id in the
# workspace) but not a default member: it targets bpfel-unknown-none and only builds
# via sensor-linux's build.rs with the eBPF toolchain present. Plain cargo commands
# skip it; CI passes --workspace --exclude sensor-linux-ebpf.
default-members = [
    "agent",
    "watchdog",
    "cli",
    "crates/schema",
    "crates/policy",
    "crates/config",
    "crates/store",
    "crates/sensors/linux/wire",
    "crates/sensors/linux/userspace",
    "crates/sensors/windows/etw",
    "crates/sensors/macos/endpoint-security",
    "crates/sensors/macos/network-extension",
    "crates/rules",
    "crates/sigma",
    "crates/correlator",
    "crates/ml",
    "crates/yara",
    "crates/intel",
    "crates/enrich",
    "crates/response",
    "crates/ipc",
    "crates/transport",
    "crates/sinks",
    "crates/updater",
    "crates/conformance",
    "crates/tamper",
    "crates/mesh",
    "crates/deception",
    "crates/device-control",
    "crates/inventory",
]

[workspace.package]
publish = false
license = "Apache-2.0"
edition = "2024"

[workspace.dependencies]
# Shared dependency versions are declared here as crates gain real code.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
